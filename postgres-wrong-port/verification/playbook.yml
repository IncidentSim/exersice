---
- name: Verify postgres-wrong-port from the client perspective
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    app_url: http://127.0.0.1:8080
    app_user: orders_api
    app_database: incidentsim
    # Part of the exercise contract: the application credential on the VM.
    app_password_file: /etc/incidentsim/orders-api.password

  tasks:
    - name: Probe PostgreSQL on the application address
      ansible.builtin.command:
        argv: [pg_isready, --host=127.0.0.1, --port=5432, --timeout=5]
      register: tcp_ready
      changed_when: false
      failed_when: false

    - name: Require PostgreSQL to accept TCP connections on 127.0.0.1:5432
      ansible.builtin.assert:
        that:
          - tcp_ready.rc == 0
        success_msg: PostgreSQL accepts TCP connections on 127.0.0.1:5432.
        fail_msg: >-
          Expected PostgreSQL to accept TCP connections on 127.0.0.1:5432,
          pg_isready reported: {{ tcp_ready.stdout | trim }} (rc={{ tcp_ready.rc }})

    - name: Read the application password
      ansible.builtin.slurp:
        src: "{{ app_password_file }}"
      register: app_password_content
      no_log: true

    - name: Log in as the application role over TCP with its password
      ansible.builtin.command:
        argv:
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --host=127.0.0.1
          - --port=5432
          - "--username={{ app_user }}"
          - "--dbname={{ app_database }}"
          - --command
          - SELECT current_user
        chdir: /
      environment:
        PGPASSWORD: "{{ app_password_content.content | b64decode | trim }}"
        PGCONNECT_TIMEOUT: "5"
      register: correct_login
      changed_when: false
      failed_when: false

    - name: Require the correct password to be accepted
      ansible.builtin.assert:
        that:
          - correct_login.rc == 0
          - correct_login.stdout | trim == app_user
        success_msg: "{{ app_user }} logs in over TCP with its password."
        fail_msg: >-
          Expected {{ app_user }} to log in to {{ app_database }} at 127.0.0.1:5432,
          got rc={{ correct_login.rc }}: {{ correct_login.stderr | trim }}

    - name: Save a test order through the application
      ansible.builtin.uri:
        url: "{{ app_url }}/orders"
        method: POST
        body_format: json
        body:
          item: verification
          note: authentication check
        status_code: [201]
        return_content: true
        timeout: 10
      register: probe_write
      failed_when: false

    - name: Require the order to be accepted
      ansible.builtin.assert:
        that:
          - probe_write.status == 201
        fail_msg: >-
          Expected HTTP 201 from POST /orders, got {{ probe_write.status }}:
          {{ probe_write.content | default(probe_write.msg) | default('') }}

    - name: Read the test order back
      ansible.builtin.uri:
        url: "{{ app_url }}/orders/{{ probe_write.json.id }}"
        return_content: true
        status_code: [200]
        timeout: 10
      register: probe_read
      failed_when: false

    - name: Require the stored order to match
      ansible.builtin.assert:
        that:
          - probe_read.status == 200
          - probe_read.json.item == "verification"
        success_msg: The application stores and reads orders.
        fail_msg: >-
          Expected order {{ probe_write.json.id }} to be read back, got HTTP
          {{ probe_read.status }}.
