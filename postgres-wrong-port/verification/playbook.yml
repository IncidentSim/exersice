---
- name: Verify postgres-wrong-port from the client perspective
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    app_url: http://127.0.0.1:8080
    app_user: orders_api
    app_database: incidentsim
    # Part of the exercise contract: the application credential on the VM.
    app_password_file: /etc/incidentsim/orders-api.password

  tasks:
    - name: Probe PostgreSQL on the application address
      ansible.builtin.command:
        argv: [pg_isready, --host=127.0.0.1, --port=5432, --timeout=5]
      register: tcp_ready
      changed_when: false
      failed_when: false

    - name: Require PostgreSQL to accept TCP connections on 127.0.0.1:5432
      incidentsim.verify.check:
        id: db.tcp-ready
        description: PostgreSQL accepts TCP connections on 127.0.0.1:5432
        passed: "{{ (tcp_ready | incidentsim.verify.dig('rc')) == 0 }}"
        error: "{{ tcp_ready | incidentsim.verify.technical_error }}"
        observed: "{{ tcp_ready | incidentsim.verify.dig('stdout', '') | trim }} (rc={{ tcp_ready | incidentsim.verify.dig('rc', '?') }})"
        expected: accepting connections (rc=0) on 127.0.0.1:5432

    - name: Read the application password
      ansible.builtin.slurp:
        src: "{{ app_password_file }}"
      register: app_password_content
      no_log: true

    - name: Log in as the application role over TCP with its password
      ansible.builtin.command:
        argv:
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --host=127.0.0.1
          - --port=5432
          - "--username={{ app_user }}"
          - "--dbname={{ app_database }}"
          - --command
          - SELECT current_user
        chdir: /
      environment:
        PGPASSWORD: "{{ app_password_content.content | b64decode | trim }}"
        PGCONNECT_TIMEOUT: "5"
      register: correct_login
      changed_when: false
      failed_when: false
      no_log: true # the task carries the application password in PGPASSWORD

    - name: Require the correct password to be accepted
      incidentsim.verify.check:
        id: db.correct-password-accepted
        description: The application role logs in over TCP with its password
        passed: "{{ (correct_login | incidentsim.verify.dig('rc')) == 0 and (correct_login | incidentsim.verify.dig('stdout', '') | trim) == app_user }}"
        error: "{{ correct_login | incidentsim.verify.technical_error }}"
        observed: "rc={{ correct_login | incidentsim.verify.dig('rc', '?') }}"
        expected: "{{ app_user }} logs in to {{ app_database }} at 127.0.0.1:5432 (rc=0)"
        evidence: "{{ correct_login | incidentsim.verify.dig('stderr', '') | trim }}"

    - name: Save a test order through the application
      ansible.builtin.uri:
        url: "{{ app_url }}/orders"
        method: POST
        body_format: json
        body:
          item: verification
          note: authentication check
        status_code: [201]
        return_content: true
        timeout: 10
      register: probe_write
      failed_when: false

    - name: Require the order to be accepted
      incidentsim.verify.check:
        id: app.write-accepted
        description: The application accepts a new order
        passed: "{{ (probe_write | incidentsim.verify.dig('status')) == 201 and (probe_write | incidentsim.verify.dig('json.id')) is not none }}"
        error: "{{ probe_write | incidentsim.verify.technical_error }}"
        observed: "HTTP {{ probe_write | incidentsim.verify.dig('status', 'no response') }}"
        expected: HTTP 201 from POST /orders
        evidence: "{{ probe_write | incidentsim.verify.dig('msg', '') }}"

    - name: Read the test order back
      ansible.builtin.uri:
        url: "{{ app_url }}/orders/{{ probe_write.json.id }}"
        return_content: true
        status_code: [200]
        timeout: 10
      register: probe_read
      failed_when: false

    - name: Require the stored order to match
      incidentsim.verify.check:
        id: app.read-back
        description: The stored order is read back unchanged
        passed: "{{ (probe_read | incidentsim.verify.dig('status')) == 200 and (probe_read | incidentsim.verify.dig('json.item')) == 'verification' }}"
        error: "{{ probe_read | incidentsim.verify.technical_error }}"
        observed: "HTTP {{ probe_read | incidentsim.verify.dig('status', 'no response') }}"
        expected: "HTTP 200 for order {{ probe_write.json.id }} with item verification"
