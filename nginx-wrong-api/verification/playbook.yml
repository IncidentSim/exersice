---
- name: Verify nginx-wrong-api from the client perspective
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    verification_host: verification.incidentsim.test
    # Overridable only for isolated test fixtures.
    verification_url: http://127.0.0.1/

  tasks:
    - name: Send a request through Nginx with a controlled Host header
      ansible.builtin.uri:
        url: "{{ verification_url }}"
        headers:
          Host: "{{ verification_host }}"
        return_content: true
        status_code: 200
        timeout: 10
      register: verification_response
      failed_when: false

    - name: Require Nginx to serve the request
      incidentsim.verify.check:
        id: app.reachable
        description: Nginx answers the request with HTTP 200
        passed: "{{ verification_response | incidentsim.verify.dig('status') == 200 }}"
        error: "{{ verification_response | incidentsim.verify.technical_error }}"
        observed: "{{ verification_response | incidentsim.verify.dig('status', 'no response') }}"
        expected: 200
        evidence: "{{ verification_response | incidentsim.verify.dig('msg', '') }}"

    - name: Require the application to receive the original Host header
      incidentsim.verify.check:
        id: host.header-preserved
        description: The echo-server received the client's original Host header
        passed: "{{ (verification_response | incidentsim.verify.dig('json.host')) == verification_host }}"
        observed: "{{ verification_response | incidentsim.verify.dig('json.host', 'no host value') }}"
        expected: "{{ verification_host }}"
