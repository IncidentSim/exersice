---
- name: Verify postgres-bad-config from the client perspective
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    app_url: http://127.0.0.1:8080
    # Settings delivered by the tuning release that must stay in effect.
    expected_settings:
      work_mem: 16MB
      effective_cache_size: 512MB

  tasks:
    - name: Read the effective PostgreSQL settings
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --field-separator=|
          - --command
          - >-
            SELECT current_setting('work_mem'),
                   current_setting('effective_cache_size'),
                   pg_size_bytes(current_setting('shared_buffers')),
                   current_setting('shared_buffers')
        chdir: /
      register: settings_query
      changed_when: false
      failed_when: false

    - name: Require PostgreSQL to accept connections
      incidentsim.verify.check:
        id: db.accepts-connections
        description: PostgreSQL accepts local connections
        passed: "{{ (settings_query | incidentsim.verify.dig('rc')) == 0 }}"
        error: "{{ settings_query | incidentsim.verify.technical_error }}"
        observed: "rc={{ settings_query | incidentsim.verify.dig('rc', '?') }}"
        expected: rc=0
        evidence: "{{ settings_query | incidentsim.verify.dig('stderr', '') | trim }}"

    - name: Read the VM memory size
      ansible.builtin.slurp:
        src: /proc/meminfo
      register: meminfo

    - name: Parse the observed values
      ansible.builtin.set_fact:
        observed_settings:
          work_mem: "{{ (settings_query.stdout | trim).split('|')[0] }}"
          effective_cache_size: "{{ (settings_query.stdout | trim).split('|')[1] }}"
        shared_buffers_bytes: "{{ (settings_query.stdout | trim).split('|')[2] | int }}"
        shared_buffers_text: "{{ (settings_query.stdout | trim).split('|')[3] }}"
        memory_bytes: >-
          {{ (meminfo.content | b64decode | regex_search('MemTotal:\s+(\d+) kB', '\1') | first | int) * 1024 }}

    - name: Require the tuning settings to stay in effect
      incidentsim.verify.check:
        id: settings.tuning-retained
        description: The settings from the tuning release remain in effect
        passed: "{{ observed_settings == expected_settings }}"
        observed: "{{ observed_settings }}"
        expected: "{{ expected_settings }}"

    - name: Require shared_buffers to fit the VM
      incidentsim.verify.check:
        id: settings.shared-buffers-fit
        description: shared_buffers does not exceed half of the VM memory
        passed: "{{ shared_buffers_bytes | int <= (memory_bytes | int) // 2 }}"
        observed: "shared_buffers = {{ shared_buffers_text }}"
        expected: "shared_buffers <= {{ (memory_bytes | int) // 2097152 }} MiB (half of the VM memory)"

    - name: Save a test order through the application
      ansible.builtin.uri:
        url: "{{ app_url }}/orders"
        method: POST
        body_format: json
        body:
          item: verification
          note: configuration check
        status_code: [201]
        return_content: true
        timeout: 10
      register: probe_write
      failed_when: false

    - name: Require the order to be accepted
      incidentsim.verify.check:
        id: app.write-accepted
        description: The application accepts a new order
        passed: "{{ (probe_write | incidentsim.verify.dig('status')) == 201 and (probe_write | incidentsim.verify.dig('json.id')) is not none }}"
        error: "{{ probe_write | incidentsim.verify.technical_error }}"
        observed: "HTTP {{ probe_write | incidentsim.verify.dig('status', 'no response') }}"
        expected: HTTP 201 from POST /orders
        evidence: "{{ probe_write | incidentsim.verify.dig('msg', '') }}"

    - name: Read the test order back
      ansible.builtin.uri:
        url: "{{ app_url }}/orders/{{ probe_write.json.id }}"
        return_content: true
        status_code: [200]
        timeout: 10
      register: probe_read
      failed_when: false

    - name: Require the stored order to match
      incidentsim.verify.check:
        id: app.read-back
        description: The stored order is read back unchanged
        passed: "{{ (probe_read | incidentsim.verify.dig('status')) == 200 and (probe_read | incidentsim.verify.dig('json.item')) == 'verification' }}"
        error: "{{ probe_read | incidentsim.verify.technical_error }}"
        observed: "HTTP {{ probe_read | incidentsim.verify.dig('status', 'no response') }}, item {{ probe_read | incidentsim.verify.dig('json.item', 'none') }}"
        expected: "HTTP 200 for order {{ probe_write.json.id }} with item verification"
