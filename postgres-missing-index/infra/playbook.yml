---
- name: Deploy the healthy postgres-missing-index infrastructure
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  vars:
    exercise_root: /opt/incidentctl/postgres-missing-index
    app_root: "{{ exercise_root }}/sales-api"
    app_user: sales_api
    app_port: 8080
    app_url: "http://127.0.0.1:{{ app_port }}"
    app_database: incidentsim
    app_statement_timeout: 2s
    postgresql_package_version: 16.15-0ubuntu0.24.04.1
    psycopg2_package_version: 2.9.9-1build1
    pg_unit: postgresql@16-main.service
    pg_conf_dir: /etc/postgresql/16/main
    pg_bin_dir: /usr/lib/postgresql/16/bin
    pg_data_dir: /var/lib/postgresql/16/main
    # Calibrated on a 1 vCPU / 1 GiB VM: about 780 MB of sales, roughly
    # 0.5 s per customer report without the index and 3-6 ms with it.
    sales_rows: 12000000
    sales_customers: 100000
    sales_index: sales_customer_id_idx

  tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version("24.04", ">=")
          - ansible_facts.distribution_version is version("24.10", "<")
        fail_msg: This exercise requires Ubuntu 24.04.

    # --- PostgreSQL ------------------------------------------------------

    - name: Install PostgreSQL and the application driver at recorded versions
      ansible.builtin.apt:
        name:
          - "postgresql-16={{ postgresql_package_version }}"
          - "postgresql-client-16={{ postgresql_package_version }}"
          - "python3-psycopg2={{ psycopg2_package_version }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101

    - name: Check the cluster data directory
      ansible.builtin.stat:
        path: "{{ pg_data_dir }}/PG_VERSION"
      register: pg_data_version

    - name: Create the main cluster
      ansible.builtin.command:
        argv: [pg_createcluster, --port, "5432", "16", main]
      when: not pg_data_version.stat.exists
      changed_when: true

    - name: Install the healthy PostgreSQL settings
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/postgresql.conf.j2"
        dest: "{{ pg_conf_dir }}/conf.d/50-incidentsim.conf"
        owner: postgres
        group: postgres
        mode: "0644"
      notify: Restart PostgreSQL

    - name: Install the PostgreSQL monitoring settings
      ansible.builtin.template:
        src: "{{ playbook_dir }}/monitoring/postgresql-monitoring.conf.j2"
        dest: "{{ pg_conf_dir }}/conf.d/90-incidentsim-monitoring.conf"
        owner: postgres
        group: postgres
        mode: "0644"
      notify: Restart PostgreSQL

    - name: Find configuration files not managed by the exercise
      ansible.builtin.find:
        paths: "{{ pg_conf_dir }}/conf.d"
        patterns: "*"
        excludes:
          - 50-incidentsim.conf
          - 90-incidentsim-monitoring.conf
        hidden: true
      register: unmanaged_conf

    - name: Remove unmanaged configuration files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ unmanaged_conf.files }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Restart PostgreSQL

    - name: Clear settings made with ALTER SYSTEM
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/postgresql.auto.conf.j2"
        dest: "{{ pg_data_dir }}/postgresql.auto.conf"
        owner: postgres
        group: postgres
        mode: "0600"
      notify: Restart PostgreSQL

    - name: Enable and start PostgreSQL
      ansible.builtin.systemd_service:
        name: "{{ pg_unit }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply PostgreSQL changes before creating the schema
      ansible.builtin.meta: flush_handlers

    - name: Wait for PostgreSQL to accept connections
      ansible.builtin.command:
        argv: [runuser, -u, postgres, --, pg_isready, --quiet]
      register: pg_ready
      changed_when: false
      failed_when: false
      retries: 15
      delay: 2
      until: pg_ready.rc == 0

    - name: Require PostgreSQL to be ready
      ansible.builtin.assert:
        that:
          - pg_ready.rc == 0
        fail_msg: "PostgreSQL did not accept connections (pg_isready rc={{ pg_ready.rc }})."

    - name: Check for per-role and per-database setting overrides
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --command
          - SELECT count(*) FROM pg_db_role_setting
        chdir: /
      register: setting_overrides
      changed_when: false

    - name: Create the exercise directory
      ansible.builtin.file:
        path: "{{ exercise_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the setting override reset script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/reset-overrides.sql"
        dest: "{{ exercise_root }}/reset-overrides.sql"
        owner: root
        group: root
        mode: "0644"

    - name: Reset per-role and per-database setting overrides
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --quiet
          - --set
          - ON_ERROR_STOP=1
          - --file
          - "{{ exercise_root }}/reset-overrides.sql"
        chdir: /
      when: setting_overrides.stdout | trim != "0"
      changed_when: true

    # --- Database and application ----------------------------------------

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the sales-api source, schema, and seed
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../apps/sales-api/{{ item }}"
        dest: "{{ app_root }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - app.py
        - schema.sql
        - seed.sql
      register: app_files
      notify: Restart sales-api

    - name: Check whether the application database exists
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --command
          - "SELECT count(*) FROM pg_database WHERE datname = '{{ app_database }}'"
        chdir: /
      register: app_database_exists
      changed_when: false

    - name: Create the application database
      ansible.builtin.command:
        argv: [runuser, -u, postgres, --, createdb, "{{ app_database }}"]
        chdir: /
      when: app_database_exists.stdout | trim == "0"
      changed_when: true

    - name: Check the application schema and grants
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --dbname
          - "{{ app_database }}"
          - --command
          - >-
            SELECT to_regclass('public.sales') IS NOT NULL
               AND EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ app_user }}')
               AND has_table_privilege('{{ app_user }}', 'public.sales', 'SELECT')
        chdir: /
      register: app_schema_ready
      changed_when: false

    - name: Apply the application schema
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --quiet
          - --set
          - ON_ERROR_STOP=1
          - --dbname
          - "{{ app_database }}"
          - --file
          - "{{ app_root }}/schema.sql"
        chdir: /
      when: app_schema_ready.stdout | trim != "t" or app_files.changed
      changed_when: true

    - name: Check whether the sales history is loaded
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --dbname
          - "{{ app_database }}"
          - --command
          - SELECT EXISTS (SELECT 1 FROM sales)
        chdir: /
      register: sales_loaded
      changed_when: false

    - name: Load the sales history
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --quiet
          - --set
          - ON_ERROR_STOP=1
          - --set
          - "rows={{ sales_rows }}"
          - --set
          - "customers={{ sales_customers }}"
          - --dbname
          - "{{ app_database }}"
          - --file
          - "{{ app_root }}/seed.sql"
          - --command
          - VACUUM ANALYZE sales
        chdir: /
      when: sales_loaded.stdout | trim != "t"
      changed_when: true

    # An interrupted CREATE INDEX CONCURRENTLY leaves an invalid index that
    # the planner ignores; rebuild it instead of keeping it.
    - name: Check the customer index
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --dbname
          - "{{ app_database }}"
          - --command
          - >-
            SELECT coalesce((SELECT CASE WHEN i.indisvalid THEN 'valid' ELSE 'invalid' END
                             FROM pg_index AS i
                             WHERE i.indexrelid = to_regclass('public.{{ sales_index }}')),
                            'missing')
        chdir: /
      register: sales_index_state
      changed_when: false

    - name: Drop an invalid customer index
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --quiet
          - --set
          - ON_ERROR_STOP=1
          - --dbname
          - "{{ app_database }}"
          - --command
          - "DROP INDEX {{ sales_index }}"
        chdir: /
      when: sales_index_state.stdout | trim == "invalid"
      changed_when: true

    - name: Create the customer index
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --quiet
          - --set
          - ON_ERROR_STOP=1
          - --dbname
          - "{{ app_database }}"
          - --command
          - "CREATE INDEX {{ sales_index }} ON sales (customer_id)"
          - --command
          - ANALYZE sales
        chdir: /
      when: sales_index_state.stdout | trim != "valid"
      changed_when: true

    - name: Create the sales-api system user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false

    - name: Install the sales-api systemd unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/sales-api.service.j2"
        dest: /etc/systemd/system/incidentsim-sales-api.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart sales-api

    - name: Enable the sales-api service
      ansible.builtin.systemd_service:
        name: incidentsim-sales-api.service
        enabled: true
        daemon_reload: true
        state: started

    - name: Apply service changes before smoke tests
      ansible.builtin.meta: flush_handlers

    # --- Smoke tests -----------------------------------------------------

    - name: Wait for the sales-api health endpoint
      ansible.builtin.uri:
        url: "{{ app_url }}/healthz"
        return_content: true
        status_code: 200
      register: app_health
      retries: 15
      delay: 2
      until: app_health.status == 200

    - name: Request a customer report
      ansible.builtin.uri:
        url: "{{ app_url }}/customers/42/sales"
        return_content: true
        status_code: 200
      register: smoke_report

    - name: Require the report to contain sales
      ansible.builtin.assert:
        that:
          - smoke_report.json.customer_id == 42
          - smoke_report.json.orders | int > 0
        fail_msg: "The healthy infrastructure returned an empty report: {{ smoke_report.content }}"

  handlers:
    - name: Validate PostgreSQL configuration
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - "{{ pg_bin_dir }}/postgres"
          - "--config-file={{ pg_conf_dir }}/postgresql.conf"
          - -C
          - work_mem
        chdir: /
      changed_when: false
      listen: Restart PostgreSQL

    - name: Restart PostgreSQL service
      ansible.builtin.systemd_service:
        name: "{{ pg_unit }}"
        daemon_reload: true
        state: restarted
      listen: Restart PostgreSQL

    - name: Restart sales-api
      ansible.builtin.systemd_service:
        name: incidentsim-sales-api.service
        daemon_reload: true
        state: restarted
