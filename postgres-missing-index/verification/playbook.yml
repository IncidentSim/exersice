---
- name: Verify postgres-missing-index from the client perspective
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    app_url: http://127.0.0.1:8080
    app_database: incidentsim
    customer_count: 100000
    report_count: 5
    # Calibrated on a 1 vCPU / 1 GiB VM: about 0.005 s with the index and
    # about 0.5 s without it.
    max_report_seconds: 0.1

  tasks:
    # New customers on every run, so cached answers do not help.
    - name: Choose customers for this run
      ansible.builtin.set_fact:
        customers: "{{ (range(1, customer_count + 1) | list | shuffle)[:report_count] }}"

    # ansible.builtin.uri reports elapsed time in whole seconds only.
    - name: Request customer reports and measure their latency
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --max-time
          - "10"
          - --write-out
          - "\n%{http_code} %{time_total}"
          - "{{ app_url }}/customers/{{ item }}/sales"
      loop: "{{ customers }}"
      register: reports
      changed_when: false
      failed_when: false

    - name: Count the same sales directly in PostgreSQL
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --dbname
          - "{{ app_database }}"
          - --command
          - "SELECT count(*) FROM sales WHERE customer_id = {{ item | int }}"
        chdir: /
      loop: "{{ customers }}"
      register: expected_counts
      changed_when: false

    - name: Collect one row per customer
      ansible.builtin.set_fact:
        report_rows: >-
          {{ report_rows | default([]) + [{
               'customer': item.0.item,
               'rc': item.0.rc | default(-1),
               'http': (item.0.stdout_lines[-1].split()[0] if (item.0.stdout_lines | default([]) | length) > 0 else ''),
               'seconds': (item.0.stdout_lines[-1].split()[1] | float if (item.0.stdout_lines | default([]) | length) > 0 and (item.0.stdout_lines[-1].split() | length) > 1 else none),
               'orders': ((item.0.stdout_lines[:-1] | join('\n') | from_json).orders | int
                          if ((item.0.stdout_lines[:-1] | join('\n')) is match('^\s*\{')) else none),
               'expected': item.1.stdout | trim | int
             }] }}
      loop: "{{ reports.results | zip(expected_counts.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"

    - name: Require every report request to succeed
      incidentsim.verify.check:
        id: reports.http-ok
        description: Every customer report request returns HTTP 200
        passed: "{{ report_rows | rejectattr('http', 'equalto', '200') | list | length == 0 and report_rows | rejectattr('rc', 'equalto', 0) | list | length == 0 }}"
        error: "{{ reports.results | map('incidentsim.verify.technical_error') | select | first | default('') }}"
        observed: "{{ report_rows | map(attribute='customer') | zip(report_rows | map(attribute='http')) | map('join', ': HTTP ') | join('; ') }}"
        expected: HTTP 200 for every customer

    - name: Require every report to match the database
      incidentsim.verify.check:
        id: reports.counts-correct
        description: The reported number of sales matches PostgreSQL for each customer
        # A missing or unparsable count is none and never equals a number.
        passed: "{{ (report_rows | map(attribute='orders') | list) == (report_rows | map(attribute='expected') | list) }}"
        observed: "{{ report_rows | map(attribute='customer') | zip(report_rows | map(attribute='orders')) | map('join', ': ') | join('; ') }}"
        expected: "{{ report_rows | map(attribute='customer') | zip(report_rows | map(attribute='expected')) | map('join', ': ') | join('; ') }}"

    - name: Require every report to be fast
      incidentsim.verify.check:
        id: reports.latency-within-budget
        description: Every report is served within the latency budget
        passed: "{{ report_rows | rejectattr('seconds', 'equalto', none) | list | length == report_rows | length and (report_rows | map(attribute='seconds') | max) <= max_report_seconds }}"
        observed: "{{ report_rows | map(attribute='customer') | zip(report_rows | map(attribute='seconds')) | map('join', ': ') | join(' s; ') }} s"
        expected: "each report <= {{ max_report_seconds }} s"
