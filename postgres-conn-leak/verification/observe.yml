---
- name: Wait for the next sample
  ansible.builtin.pause:
    seconds: "{{ sample_interval }}"
  when: sample_index | int > 0

- name: Check the orders-api health endpoint
  ansible.builtin.uri:
    url: "{{ app_url }}/healthz"
    return_content: true
    status_code: [200]
    timeout: 10
  register: probe_health
  failed_when: false

- name: Read the test order
  ansible.builtin.uri:
    url: "{{ app_url }}/orders/{{ probe_order_id }}"
    return_content: true
    status_code: [200]
    timeout: 10
  register: probe_read
  failed_when: false

- name: Require the application to serve requests
  incidentsim.verify.check:
    id: "window.served.{{ '%02d' | format(sample_index | int) }}"
    description: "Sample {{ sample_index }}: /healthz and the test order are served"
    passed: >-
      {{ (probe_health | incidentsim.verify.dig('status')) == 200
         and (probe_read | incidentsim.verify.dig('status')) == 200
         and (probe_read | incidentsim.verify.dig('json.item')) == 'verification' }}
    error: "{{ (probe_health | incidentsim.verify.technical_error) or (probe_read | incidentsim.verify.technical_error) }}"
    observed: >-
      /healthz {{ probe_health | incidentsim.verify.dig('status', 'no response') }},
      /orders/{{ probe_order_id }} {{ probe_read | incidentsim.verify.dig('status', 'no response') }}
    expected: HTTP 200 from /healthz and /orders/{{ probe_order_id }} (item verification)
    evidence: "{{ probe_health | incidentsim.verify.dig('msg', '') }}"

- name: Count client sessions in PostgreSQL
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - --no-psqlrc
      - --tuples-only
      - --no-align
      - --command
      - >-
        SELECT count(*) FROM pg_stat_activity
        WHERE backend_type = 'client backend' AND pid <> pg_backend_pid()
    chdir: /
  register: session_count
  changed_when: false

# A non-numeric answer is recorded as an invalid sample (null), which the
# metrics module drops and reports instead of silently counting it as zero.
- name: Record the sample
  ansible.builtin.set_fact:
    session_samples: >-
      {{ session_samples + [{
           'ts': (sample_index | int) * (sample_interval | int),
           'name': 'client_sessions',
           'labels': {},
           'value': (session_count.stdout | trim | int) if (session_count.stdout | trim) is match('^[0-9]+$') else none
         }] }}
