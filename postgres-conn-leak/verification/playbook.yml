---
- name: Verify postgres-conn-leak from the client perspective
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    app_url: http://127.0.0.1:8080
    # Observation window: 13 samples, 10 seconds apart (120 seconds).
    sample_count: 13
    sample_interval: 10
    # Raising the limit far enough to hide a leak is not a fix.
    max_connections_ceiling: 200
    # Allowed change in the number of client sessions during the second
    # half of the window, once short-lived sessions have settled.
    max_session_drift: 3

  tasks:
    - name: Read max_connections from PostgreSQL
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --command
          - SHOW max_connections
        chdir: /
      register: max_connections_query
      changed_when: false
      failed_when: false

    - name: Require PostgreSQL to accept connections
      incidentsim.verify.check:
        id: db.accepts-connections
        description: PostgreSQL accepts local connections
        passed: "{{ (max_connections_query | incidentsim.verify.dig('rc')) == 0 }}"
        error: "{{ max_connections_query | incidentsim.verify.technical_error }}"
        observed: "rc={{ max_connections_query | incidentsim.verify.dig('rc', '?') }}"
        expected: rc=0
        evidence: "{{ max_connections_query | incidentsim.verify.dig('stderr', '') | trim }}"

    - name: Require a bounded connection limit
      incidentsim.verify.check:
        id: db.max-connections-bounded
        description: max_connections is not raised to hide the leak
        passed: "{{ (max_connections_query.stdout | trim) is match('^[0-9]+$') and (max_connections_query.stdout | trim | int) <= max_connections_ceiling }}"
        observed: "max_connections = {{ max_connections_query.stdout | trim }}"
        expected: "max_connections <= {{ max_connections_ceiling }} (a larger limit only delays exhaustion)"

    - name: Save a test order through the application
      ansible.builtin.uri:
        url: "{{ app_url }}/orders"
        method: POST
        body_format: json
        body:
          item: verification
          note: connection leak check
        status_code: [201]
        return_content: true
        timeout: 10
      register: probe_write
      failed_when: false

    - name: Require the order to be accepted
      incidentsim.verify.check:
        id: app.write-accepted
        description: The application accepts a new order
        passed: "{{ (probe_write | incidentsim.verify.dig('status')) == 201 and (probe_write | incidentsim.verify.dig('json.id')) is not none }}"
        error: "{{ probe_write | incidentsim.verify.technical_error }}"
        observed: "HTTP {{ probe_write | incidentsim.verify.dig('status', 'no response') }}"
        expected: HTTP 201 from POST /orders
        evidence: "{{ probe_write | incidentsim.verify.dig('msg', '') }}"

    - name: Start the observation window
      ansible.builtin.set_fact:
        probe_order_id: "{{ probe_write.json.id }}"
        session_samples: []

    - name: Observe application requests and client sessions
      ansible.builtin.include_tasks: observe.yml
      loop: "{{ range(sample_count) | list }}"
      loop_control:
        loop_var: sample_index

    # Reached only when every sample passed its own check.
    - name: Record that every sample was served
      incidentsim.verify.check:
        id: window.requests-served
        description: Every request in the observation window was served
        passed: true
        observed: "{{ sample_count }} samples served"
        expected: "{{ sample_count }} samples served"

    # Window = whole observation; warm-up = first half, so only the settled
    # second half counts (as before). Missing or NaN samples make this an error.
    - name: Measure the spread of client sessions in the second half of the window
      incidentsim.verify.metrics:
        samples: "{{ session_samples }}"
        name: client_sessions
        window_seconds: "{{ (sample_count - 1) * sample_interval }}"
        warmup_seconds: "{{ ((sample_count // 2) * sample_interval) }}"
        min_samples: "{{ sample_count - (sample_count // 2) }}"
        min_coverage: 0.9
        aggregate: spread
      register: session_spread

    - name: Require a stable number of client sessions
      incidentsim.verify.check:
        id: sessions.stable
        description: Client sessions are stable during the second half of the window
        passed: "{{ session_spread.value <= max_session_drift }}"
        observed: "spread {{ session_spread.value }} over {{ session_spread.used }} samples; sessions {{ session_samples | map(attribute='value') | join(', ') }}"
        expected: "spread <= {{ max_session_drift }}"
