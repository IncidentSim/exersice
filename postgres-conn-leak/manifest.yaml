schema_version: 1
id: postgres-conn-leak
description: A report worker leaks PostgreSQL connections until the orders application is starved.
environment: vm.json
actions:
  provision:
    playbook: infra/playbook.yml
  inject:
    playbook: incident/playbook.yml
verification:
  playbook: verification/playbook.yml
  timeout: 6m
  report:
    schema: incidentsim.verify/v1
    checks:
      - db.accepts-connections
      - db.max-connections-bounded
      - app.write-accepted
      - window.requests-served
      - sessions.stable
