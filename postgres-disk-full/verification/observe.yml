---
- name: Wait for the next sample
  ansible.builtin.pause:
    seconds: "{{ sample_interval }}"
  when: sample_index | int > 0

- name: Save a test order through the application
  ansible.builtin.uri:
    url: "{{ app_url }}/orders"
    method: POST
    body_format: json
    body:
      item: "verification-{{ sample_index }}"
      note: "{{ probe_note }}"
    status_code: [201]
    return_content: true
    timeout: 10
  register: probe_write
  failed_when: false

- name: Require the order to be accepted
  incidentsim.verify.check:
    id: "window.accepted.{{ '%02d' | format(sample_index | int) }}"
    description: "Sample {{ sample_index }}: the order is accepted"
    passed: "{{ (probe_write | incidentsim.verify.dig('status')) == 201 and (probe_write | incidentsim.verify.dig('json.id')) is not none }}"
    error: "{{ probe_write | incidentsim.verify.technical_error }}"
    observed: "HTTP {{ probe_write | incidentsim.verify.dig('status', 'no response') }}"
    expected: HTTP 201 from POST /orders
    evidence: "{{ (probe_write | incidentsim.verify.dig('content')) or (probe_write | incidentsim.verify.dig('msg', '')) }}"

- name: Read the test order back
  ansible.builtin.uri:
    url: "{{ app_url }}/orders/{{ probe_write.json.id }}"
    return_content: true
    status_code: [200]
    timeout: 10
  register: probe_read
  failed_when: false

- name: Require the stored order to match
  incidentsim.verify.check:
    id: "window.readback.{{ '%02d' | format(sample_index | int) }}"
    description: "Sample {{ sample_index }}: the order is read back unchanged"
    passed: >-
      {{ (probe_read | incidentsim.verify.dig('status')) == 200
         and (probe_read | incidentsim.verify.dig('json.item')) == 'verification-' ~ sample_index
         and (probe_read | incidentsim.verify.dig('json.note')) == probe_note }}
    error: "{{ probe_read | incidentsim.verify.technical_error }}"
    observed: "HTTP {{ probe_read | incidentsim.verify.dig('status', 'no response') }}"
    expected: "HTTP 200 for order {{ probe_write.json.id }} with the original item and note"

- name: Measure free space on the PostgreSQL data filesystem
  ansible.builtin.command:
    argv: [df, --block-size=1M, --output=avail, "{{ data_directory }}"]
  register: free_space
  changed_when: false

- name: Read the result of the latest backup run
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ backup_service }}"
      - --property=ExecMainExitTimestampMonotonic
      - --property=ExecMainStatus
  register: backup_state
  changed_when: false

# A non-numeric df answer becomes an invalid (null) sample: the metrics module
# drops it and reports it instead of counting it as zero free space.
- name: Record the sample
  ansible.builtin.set_fact:
    free_samples: >-
      {{ free_samples + [{
           'ts': (sample_index | int) * (sample_interval | int),
           'name': 'free_mib',
           'labels': {},
           'value': (free_space.stdout_lines[-1] | trim | int) if (free_space.stdout_lines[-1] | trim) is match('^[0-9]+$') else none
         }] }}
    backup_samples: >-
      {{ backup_samples + [{
           'exit_ts': backup_state.stdout | regex_search('ExecMainExitTimestampMonotonic=(\d+)', '\1') | first,
           'status': backup_state.stdout | regex_search('ExecMainStatus=(\d+)', '\1') | first
         }] }}
