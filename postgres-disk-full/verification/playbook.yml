---
- name: Verify postgres-disk-full from the client perspective
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    app_url: http://127.0.0.1:8080
    backup_service: incidentsim-backup.service
    # Observation window: 13 samples, 10 seconds apart (120 seconds).
    sample_count: 13
    sample_interval: 10
    # The backup timer runs every 15 seconds: expect at least 5 of ~8 runs.
    min_backup_runs: 5
    # A single backup of the exercise database is about 17 MiB.
    min_free_mib: 48
    max_free_decline_mib: 40
    probe_note: "{{ 'v' * 1500 }}"

  tasks:
    - name: Ask PostgreSQL where its data is stored
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --command
          - SHOW data_directory
        chdir: /
      register: data_directory_query
      changed_when: false
      failed_when: false

    - name: Require PostgreSQL to accept connections
      incidentsim.verify.check:
        id: db.accepts-connections
        description: PostgreSQL accepts local connections
        passed: "{{ (data_directory_query | incidentsim.verify.dig('rc')) == 0 and (data_directory_query | incidentsim.verify.dig('stdout', '') | trim | length) > 0 }}"
        error: "{{ data_directory_query | incidentsim.verify.technical_error }}"
        observed: "rc={{ data_directory_query | incidentsim.verify.dig('rc', '?') }}"
        expected: rc=0 and a data directory
        evidence: "{{ data_directory_query | incidentsim.verify.dig('stderr', '') | trim }}"

    - name: Start the observation window
      ansible.builtin.set_fact:
        data_directory: "{{ data_directory_query.stdout | trim }}"
        free_samples: []
        backup_samples: []

    - name: Observe writes, free space, and backups
      ansible.builtin.include_tasks: observe.yml
      loop: "{{ range(sample_count) | list }}"
      loop_control:
        loop_var: sample_index

    # Reached only when every write of the window was accepted and read back.
    - name: Record that every write was served
      incidentsim.verify.check:
        id: window.writes-served
        description: Every order in the observation window was accepted and read back
        passed: true
        observed: "{{ sample_count }} of {{ sample_count }} writes served"
        expected: "{{ sample_count }} of {{ sample_count }} writes served"

    - name: Summarize successful backup runs in the window
      ansible.builtin.set_fact:
        successful_backup_runs: >-
          {{ backup_samples
             | rejectattr('exit_ts', 'equalto', backup_samples[0].exit_ts)
             | selectattr('status', 'equalto', '0')
             | map(attribute='exit_ts')
             | unique
             | list
             | length }}

    # Backups must keep running: disabling or slowing them is not a fix.
    - name: Require backups to keep running
      incidentsim.verify.check:
        id: backups.running
        description: Backups keep finishing successfully during the window
        passed: "{{ successful_backup_runs | int >= min_backup_runs }}"
        observed: "{{ successful_backup_runs }} successful runs of {{ backup_service }} in {{ (sample_count - 1) * sample_interval }} s"
        expected: "at least {{ min_backup_runs }} successful runs"

    - name: Measure the lowest free space in the window
      incidentsim.verify.metrics:
        samples: "{{ free_samples }}"
        name: free_mib
        window_seconds: "{{ (sample_count - 1) * sample_interval }}"
        min_samples: "{{ sample_count }}"
        min_coverage: 0.9
        aggregate: min
      register: free_lowest

    - name: Read the first free space sample
      incidentsim.verify.metrics:
        samples: "{{ free_samples }}"
        name: free_mib
        window_seconds: "{{ (sample_count - 1) * sample_interval }}"
        min_samples: "{{ sample_count }}"
        min_coverage: 0.9
        aggregate: first
      register: free_first

    - name: Require stable free space on the PostgreSQL data filesystem
      incidentsim.verify.check:
        id: storage.free-space-stable
        description: The data filesystem keeps free space and does not keep shrinking
        passed: "{{ free_lowest.value >= min_free_mib and (free_first.value - free_lowest.value) <= max_free_decline_mib }}"
        observed: "free MiB: {{ free_samples | map(attribute='value') | join(', ') }}; decline {{ free_first.value - free_lowest.value }} MiB"
        expected: "at least {{ min_free_mib }} MiB free and a decline of at most {{ max_free_decline_mib }} MiB on the filesystem of {{ data_directory }}"
