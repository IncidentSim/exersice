---
- name: Wait for the next sample
  ansible.builtin.pause:
    seconds: "{{ sample_interval }}"
  when: sample_index | int > 0

# The request timeout is the latency budget: a write that waits for a lock
# longer than write_timeout seconds fails with status -1.
- name: Save a test order through the application
  ansible.builtin.uri:
    url: "{{ app_url }}/orders"
    method: POST
    body_format: json
    body:
      item: "verification-{{ sample_index }}"
      note: lock check
    status_code: [201]
    return_content: true
    timeout: "{{ write_timeout }}"
  register: probe_write
  failed_when: false

- name: Require the order to be saved in time
  incidentsim.verify.check:
    id: "writes.saved.{{ '%02d' | format(sample_index | int) }}"
    description: "Sample {{ sample_index }}: the order is saved within {{ write_timeout }} s"
    passed: "{{ (probe_write | incidentsim.verify.dig('status')) == 201 }}"
    error: "{{ probe_write | incidentsim.verify.technical_error }}"
    observed: "HTTP {{ probe_write | incidentsim.verify.dig('status', 'no response') }}"
    expected: "HTTP 201 within {{ write_timeout }} s"
    evidence: "{{ (probe_write | incidentsim.verify.dig('content')) or (probe_write | incidentsim.verify.dig('msg', '')) }}"
