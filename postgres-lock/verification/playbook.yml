---
- name: Verify postgres-lock from the client perspective
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    app_url: http://127.0.0.1:8080
    # Observation window: 13 samples, 10 seconds apart (120 seconds).
    sample_count: 13
    sample_interval: 10
    # Every order must be saved faster than this many seconds.
    write_timeout: 1

  tasks:
    - name: Check the orders-api health endpoint
      ansible.builtin.uri:
        url: "{{ app_url }}/healthz"
        return_content: true
        status_code: [200]
        timeout: 5
      register: app_health
      failed_when: false

    - name: Require the application to reach the database
      incidentsim.verify.check:
        id: app.health
        description: The application reaches the database
        passed: "{{ (app_health | incidentsim.verify.dig('status')) == 200 }}"
        error: "{{ app_health | incidentsim.verify.technical_error }}"
        observed: "HTTP {{ app_health | incidentsim.verify.dig('status', 'no response') }}"
        expected: HTTP 200 from /healthz
        evidence: "{{ (app_health | incidentsim.verify.dig('content')) or (app_health | incidentsim.verify.dig('msg', '')) }}"

    - name: Save orders throughout the observation window
      ansible.builtin.include_tasks: observe.yml
      loop: "{{ range(sample_count) | list }}"
      loop_control:
        loop_var: sample_index

    # Reached only when every sample passed its own check.
    - name: Record that every write was fast enough
      incidentsim.verify.check:
        id: writes.all-within-budget
        description: Every order in the observation window was saved in time
        passed: true
        observed: "{{ sample_count }} of {{ sample_count }} writes within {{ write_timeout }} s"
        expected: "{{ sample_count }} of {{ sample_count }} writes within {{ write_timeout }} s"
