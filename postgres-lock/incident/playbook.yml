---
- name: Introduce the long-held table lock incident
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    exercise_root: /opt/incidentctl/postgres-lock
    worker_root: "{{ exercise_root }}/nightly-fix"
    worker_user: nightly_fix
    worker_unit: incidentsim-nightly-fix.service
    app_url: http://127.0.0.1:8080
    app_database: incidentsim
    pg_unit: postgresql@16-main.service

  tasks:
    - name: Check the orders-api health endpoint
      ansible.builtin.uri:
        url: "{{ app_url }}/healthz"
        status_code: 200
      register: app_health
      failed_when: false

    - name: Check that the application database exists
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --dbname
          - "{{ app_database }}"
          - --command
          - SELECT to_regclass('public.orders') IS NOT NULL
        chdir: /
      register: orders_table
      changed_when: false
      failed_when: false

    - name: Require the infrastructure to be deployed first
      ansible.builtin.assert:
        that:
          - app_health.status == 200
          - orders_table.rc == 0
          - orders_table.stdout | trim == "t"
        fail_msg: Run the infra playbook before introducing the incident.

    - name: Create the nightly-fix system user
      ansible.builtin.user:
        name: "{{ worker_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false

    - name: Create the nightly-fix directory
      ansible.builtin.file:
        path: "{{ worker_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the nightly-fix source and role
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../apps/nightly-fix/{{ item }}"
        dest: "{{ worker_root }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - nightly_fix.py
        - role.sql
      notify: Restart nightly-fix

    - name: Create the nightly-fix database role
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --quiet
          - --set
          - ON_ERROR_STOP=1
          - --dbname
          - "{{ app_database }}"
          - --file
          - "{{ worker_root }}/role.sql"
        chdir: /
      changed_when: false

    - name: Install the nightly-fix systemd unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/nightly-fix.service.j2"
        dest: "/etc/systemd/system/{{ worker_unit }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart nightly-fix

    - name: Enable and start the nightly-fix
      ansible.builtin.systemd_service:
        name: "{{ worker_unit }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply nightly-fix changes
      ansible.builtin.meta: flush_handlers

    - name: Wait until the nightly-fix holds a lock on the orders table
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - --no-psqlrc
          - --tuples-only
          - --no-align
          - --dbname
          - "{{ app_database }}"
          - --command
          - >-
            SELECT count(*) FROM pg_locks AS l
            JOIN pg_stat_activity AS a ON a.pid = l.pid
            WHERE l.relation = 'orders'::regclass AND l.mode = 'ExclusiveLock'
              AND l.granted AND a.usename = '{{ worker_user }}'
        chdir: /
      register: worker_lock
      changed_when: false
      retries: 15
      delay: 2
      until: worker_lock.stdout | trim == "1"

    - name: Try to save an order while the table is locked
      ansible.builtin.uri:
        url: "{{ app_url }}/orders"
        method: POST
        body_format: json
        body:
          item: incident-probe
          note: waits for the lock
        status_code: [201]
        timeout: 3
      register: incident_write
      failed_when: false

    - name: Require new orders to hang
      ansible.builtin.assert:
        that:
          - incident_write.status == -1
        fail_msg: >-
          Expected POST /orders to time out behind the lock, got HTTP
          {{ incident_write.status }}.
        success_msg: POST /orders waits behind the nightly-fix lock.

  handlers:
    - name: Restart nightly-fix
      ansible.builtin.systemd_service:
        name: "{{ worker_unit }}"
        daemon_reload: true
        state: restarted
